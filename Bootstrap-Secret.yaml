apiVersion: v1
kind: Secret
metadata:
  name: vm-01-argotest-bootstrap-secret
  labels:
    vm-selector: vm-01-argotest
stringData:
  user-data: |
    #cloud-config
    #cloud-config
    hostname: cli-vm-01
    manage_etc_hosts: true
    ssh_pwauth: true
    chpasswd:
      list: |
        root:VMware123!
        ubuntu:VMware123!
      expire: false
    users:
      - name: ubuntu
        sudo: ALL=(ALL) NOPASSWD:ALL
        lock_password: false
        shell: /bin/bash
    write_files:
      - path: /etc/netplan/50-cloud-init.yaml
        permissions: '0600'
        overwrite: true
        content: |
          network:
            version: 2
            ethernets:
              ens192:
                dhcp4: true
    packages:
      - net-tools
    runcmd:
      - netplan generate
      - netplan apply
      - echo "Installing kubectl..."
      - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
      - rm kubectl
      - echo "Installing VCF 9.1 CLI..."
      - curl -LO "https://packages.broadcom.com/artifactory/vcf-distro/vcf-cli/linux/amd64/v9.0.0/vcf-cli.tar.gz"
      - tar -xzf vcf-cli.tar.gz
      - install -o root -g root -m 0755 vcf-cli-linux_amd64 /usr/local/bin/vcf
      - rm vcf-cli.tar.gz vcf-cli-linux_amd64
      - echo "Installing PowerShell & VMware PowerCLI..."
      - curl -sSL "https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb" -o packages-microsoft-prod.deb
      - dpkg -i packages-microsoft-prod.deb
      - rm packages-microsoft-prod.deb
      - apt-get update
      - apt-get install -y powershell
      - pwsh -Command "Set-PSRepository -Name PSGallery -InstallationPolicy Trusted"
      - pwsh -Command "Install-Module -Name VMware.PowerCLI -Scope AllUsers -Force"
      - echo "Configuring SSH For WinSCP and Root access..."
      - mkdir -p /etc/ssh/sshd_config.d
      - echo "PermitRootLogin yes" > /etc/ssh/sshd_config.d/50-root-login.conf
      - echo "PasswordAuthentication yes" >> /etc/ssh/sshd_config.d/50-root-login.conf
      - passwd -u root
      - systemctl restart ssh